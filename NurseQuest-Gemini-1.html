<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NurseQuest — VII Semester (Gemini 3.8 Fixed)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10141F">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NurseQuest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10141F;
  --panel:#1A2036;
  --panel-raised:#232B47;
  --panel-line:#2E3656;
  --amber:#F2A65A;
  --amber-dim:#8a6a3c;
  --teal:#4FD1C5;
  --text:#EDEAE3;
  --text-muted:#9098B1;
  --success:#7FCB8C;
  --danger:#E8697A;
  --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);font-family:'Work Sans',sans-serif;height:100%;overflow:hidden;}
h1,h2,h3,.serif{font-family:'Lora',serif;}
button{font-family:inherit;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--ink);}

/* ---------- Vitals header ---------- */
.vitals{
  position:relative;
  padding:14px 18px 12px;
  border-bottom:1px solid var(--panel-line);
  background:linear-gradient(180deg,#141A2C 0%, var(--ink) 100%);
  flex-shrink:0;
}
.vitals-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:8px;}
.brand-mark{width:28px;height:28px;flex-shrink:0;}
.brand-name{font-size:17px;font-weight:600;letter-spacing:0.2px;}
.vitals-stats{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--text-muted);}
.vstat{display:flex;align-items:center;gap:5px;}
.vstat b{color:var(--text);font-weight:600;}
.vstat .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);}
.vstat.streak .dot{background:var(--danger);}
.ecg-strip{width:100%;height:22px;margin-top:8px;overflow:hidden;}
.ecg-strip svg{width:200%;height:100%;animation:ecgmove 6s linear infinite;}
@keyframes ecgmove{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
.xpbar-track{margin-top:8px;height:5px;border-radius:3px;background:var(--panel-line);overflow:hidden;}
.xpbar-fill{height:100%;background:linear-gradient(90deg,var(--amber-dim),var(--amber));border-radius:3px;transition:width .5s ease;}

/* ---------- Screens ---------- */
.screens{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 90px;}
.screen{display:none;animation:fadein .25s ease;}
.screen.active{display:block;}
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

.hero-line{color:var(--text-muted); font-size:14px; margin:2px 0 18px; max-width:34ch;}
.section-title{font-size:13px; text-transform:none; color:var(--text-muted); margin:22px 0 10px; display:flex; align-items:center; justify-content:space-between;}
.section-title a{color:var(--teal); font-size:13px; text-decoration:none;}

/* subject cards */
.subject-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.subject-card{
  background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius);
  padding:14px; cursor:pointer; position:relative; overflow:hidden; min-height:118px;
  display:flex; flex-direction:column; justify-content:space-between;
  transition:transform .15s ease, border-color .15s ease;
}
.subject-card:active{transform:scale(0.97);}
.subject-card .ring{position:absolute; top:10px; right:10px;}
.subject-card .sname{font-family:'Lora',serif; font-weight:600; font-size:14.5px; line-height:1.25; padding-right:40px;}
.subject-card .smeta{font-size:11.5px; color:var(--text-muted);}
.subject-card .sbar-track{height:4px;background:var(--panel-line);border-radius:2px;margin-top:8px;overflow:hidden;}
.subject-card .sbar-fill{height:100%;border-radius:2px;}

.continue-card{
  background:var(--panel-raised); border:1px solid var(--panel-line); border-radius:var(--radius);
  padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;
}
.continue-card .cc-label{font-size:11.5px; color:var(--text-muted); margin-bottom:3px;}
.continue-card .cc-topic{font-size:14px; font-weight:600;}
.continue-card .cc-arrow{color:var(--amber); font-size:20px; flex-shrink:0;}

/* topic list */
.unit-block{margin-bottom:18px;}
.unit-head{font-size:12.5px; color:var(--amber); letter-spacing:0.4px; margin-bottom:8px; font-weight:600;}
.topic-row{
  display:flex; align-items:center; gap:10px; padding:12px 12px; background:var(--panel);
  border:1px solid var(--panel-line); border-radius:12px; margin-bottom:7px; cursor:pointer;
}
.topic-row .tcheck{width:18px;height:18px;border-radius:50%;border:2px solid var(--panel-line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;}
.topic-row.done .tcheck{background:var(--success);border-color:var(--success);color:#0c1a0f;}
.topic-row .ttext{font-size:13.5px; line-height:1.35;}

.backbar{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.backbtn{background:var(--panel); border:1px solid var(--panel-line); color:var(--text); width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer; flex-shrink:0;}
.backbar h2{font-size:17px; margin:0;}
.backbar .sub{font-size:12px;color:var(--text-muted);}

/* topic detail */
.topic-detail-card{background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius); padding:16px;}
.topic-detail-card h3{margin:0 0 4px; font-size:16px;}
.topic-detail-card .unit-tag{font-size:11px;color:var(--amber);}
.explain-box{margin-top:14px; font-size:14px; line-height:1.65; white-space:pre-wrap;}
.explain-placeholder{margin-top:14px; padding:20px 14px; text-align:center; color:var(--text-muted); font-size:13px; border:1px dashed var(--panel-line); border-radius:12px;}
.btn{
  background:var(--amber); color:#20140a; border:none; border-radius:12px; padding:12px 16px;
  font-weight:600; font-size:14px; cursor:pointer; width:100%; margin-top:12px;
}
.btn.secondary{background:var(--panel-raised); color:var(--text); border:1px solid var(--panel-line);}
.btn:disabled{opacity:0.5;}
.btn-row{display:flex; gap:8px;}
.btn-row .btn{margin-top:0;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.25);border-top-color:#20140a;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* quiz */
.quiz-card{background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius); padding:18px;}
.quiz-progress{font-size:12px;color:var(--text-muted); margin-bottom:10px;}
.quiz-q{font-size:15.5px; line-height:1.5; margin-bottom:16px; font-weight:500;}
.opt{
  display:block; width:100%; text-align:left; background:var(--panel-raised); border:1px solid var(--panel-line);
  color:var(--text); border-radius:12px; padding:12px 14px; margin-bottom:8px; font-size:13.8px; cursor:pointer;
}
.opt.correct{border-color:var(--success); background:rgba(127,203,140,0.14);}
.opt.wrong{border-color:var(--danger); background:rgba(232,105,122,0.14);}
.opt:disabled{cursor:default;}
.quiz-explain{margin-top:10px; padding:12px; background:var(--panel-raised); border-radius:12px; font-size:13px; color:var(--text-muted); line-height:1.5;}
.quiz-score{text-align:center; padding:30px 10px;}
.quiz-score .big{font-family:'Lora',serif; font-size:40px; font-weight:700; color:var(--amber);}

/* AI chat */
.chat-wrap{display:flex; flex-direction:column; height:100%;}
.chat-log{flex:1; overflow-y:auto; padding-bottom:8px;}
.msg{max-width:85%; padding:10px 13px; border-radius:14px; margin-bottom:8px; font-size:13.8px; line-height:1.5; white-space:pre-wrap;}
.msg.user{background:var(--amber); color:#20140a; margin-left:auto; border-bottom-right-radius:4px;}
.msg.ai{background:var(--panel); border:1px solid var(--panel-line); margin-right:auto; border-bottom-left-radius:4px;}
.chat-input-row{display:flex; gap:8px; padding-top:8px; border-top:1px solid var(--panel-line);}
.chat-input-row input{flex:1; background:var(--panel); border:1px solid var(--panel-line); color:var(--text); border-radius:12px; padding:11px 13px; font-size:14px;}
.chat-input-row button{background:var(--amber); color:#20140a; border:none; border-radius:12px; width:44px; font-size:16px; cursor:pointer;}
.chip-row{display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px;}
.chip{flex-shrink:0; background:var(--panel-raised); border:1px solid var(--panel-line); color:var(--text-muted); border-radius:20px; padding:6px 12px; font-size:12px; cursor:pointer; white-space:nowrap;}

/* profile / settings */
.stat-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:20px;}
.stat-box{background:var(--panel); border:1px solid var(--panel-line); border-radius:12px; padding:12px 8px; text-align:center;}
.stat-box .num{font-family:'Lora',serif; font-size:20px; font-weight:700; color:var(--amber);}
.stat-box .lbl{font-size:10.5px; color:var(--text-muted); margin-top:2px;}
.field-label{font-size:12.5px; color:var(--text-muted); margin:16px 0 6px;}
.field-input{width:100%; background:var(--panel); border:1px solid var(--panel-line); color:var(--text); border-radius:10px; padding:11px 13px; font-size:13.5px;}
.theme-row{display:flex; gap:8px; margin-top:6px;}
.theme-swatch{width:40px;height:40px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.theme-swatch.active{border-color:var(--text);}
.badge-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
.badge{background:var(--panel); border:1px solid var(--panel-line); border-radius:10px; padding:8px 10px; font-size:11px; text-align:center; width:64px;}
.badge.locked{opacity:0.35;}
.badge .bic{font-size:20px;}

/* bottom nav */
.navbar{
  position:absolute; bottom:0; left:0; right:0; max-width:560px; margin:0 auto;
  display:flex; background:var(--panel); border-top:1px solid var(--panel-line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.navbtn{flex:1; background:none; border:none; color:var(--text-muted); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; padding:6px 2px; cursor:pointer;}
.navbtn.active{color:var(--amber);}
.navbtn svg{width:20px;height:20px;}

/* toast */
#toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--panel-raised); border:1px solid var(--panel-line); padding:10px 16px; border-radius:20px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:50; white-space:nowrap;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

::-webkit-scrollbar{width:0;height:0;}

/* ---------- exam sheets ---------- */
.tabbar{display:flex; gap:6px; margin-bottom:16px; background:var(--panel); border:1px solid var(--panel-line); border-radius:12px; padding:4px;}
.tabbtn{flex:1; background:none; border:none; color:var(--text-muted); padding:9px 4px; border-radius:9px; font-size:13px; cursor:pointer; font-weight:500;}
.tabbtn.active{background:var(--panel-raised); color:var(--text);}
.upload-card{background:var(--panel); border:1px dashed var(--panel-line); border-radius:var(--radius); padding:18px; margin-bottom:14px;}
.upload-card h3{margin:0 0 4px; font-size:14.5px;}
.upload-card p{margin:0 0 12px; font-size:12.5px; color:var(--text-muted); line-height:1.5;}
.upload-choice-row{display:flex; gap:8px; flex-wrap:wrap;}
.upload-choice{flex:1; min-width:100px; background:var(--panel-raised); border:1px solid var(--panel-line); border-radius:10px; padding:10px 8px; text-align:center; font-size:12px; cursor:pointer;}
.upload-choice .uic{font-size:20px; display:block; margin-bottom:4px;}
input[type=file]{display:none;}
textarea.field-input{min-height:90px; resize:vertical; font-family:inherit;}
.sheet-card{background:var(--panel); border:1px solid var(--panel-line); border-radius:12px; padding:13px 14px; margin-bottom:9px; cursor:pointer;}
.sheet-card .sc-name{font-size:14px; font-weight:600;}
.sheet-card .sc-meta{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
.qa-card{background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius); padding:15px; margin-bottom:12px;}
.qa-card .qa-q{font-weight:600; font-size:14px; margin-bottom:8px; line-height:1.4;}
.qa-card .qa-a{font-size:13.5px; line-height:1.65; white-space:pre-wrap; color:var(--text);}
.flowchart{margin-top:12px; display:flex; flex-direction:column; align-items:center;}
.flow-box{width:100%; background:var(--panel-raised); border:1px solid var(--teal); border-radius:10px; padding:9px 12px; font-size:12.5px; line-height:1.4; text-align:center;}
.flow-arrow{color:var(--teal); font-size:16px; line-height:1; margin:2px 0;}
.empty-state{text-align:center; padding:36px 16px; color:var(--text-muted); font-size:13px;}

/* ---------- clinical simulation ---------- */
.sim-scene{background:radial-gradient(ellipse at top, #1c2340 0%, var(--panel) 70%); border:1px solid var(--panel-line); border-radius:var(--radius); padding:20px 16px; text-align:center; margin-bottom:14px;}
.sim-scene .scene-icon{font-size:44px; line-height:1;}
.sim-scene .scene-setting{font-size:11px; color:var(--text-muted); letter-spacing:0.5px; margin-top:6px;}
.vitals-monitor{display:flex; justify-content:center; gap:16px; margin-top:12px;}
.vmon{text-align:center;}
.vmon .vval{font-family:'Lora',serif; font-size:18px; font-weight:700;}
.vmon .vlbl{font-size:9.5px; color:var(--text-muted); letter-spacing:0.4px;}
.vmon.ok .vval{color:var(--success);}
.vmon.warn .vval{color:var(--danger);}
.status-track{height:6px; border-radius:3px; background:var(--panel-line); margin-top:10px; overflow:hidden;}
.status-fill{height:100%; border-radius:3px; transition:width .4s ease, background .4s ease;}
.sim-card{background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius); padding:16px;}
.sim-step-tag{font-size:11.5px; color:var(--teal); margin-bottom:8px;}
.sim-scenario-card{background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius); padding:14px; margin-bottom:10px; display:flex; gap:12px; align-items:center; cursor:pointer;}
.sim-scenario-card .ssc-icon{font-size:28px; flex-shrink:0;}
.sim-scenario-card .ssc-title{font-weight:600; font-size:14px;}
.sim-scenario-card .ssc-sub{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
.sim-outcome{text-align:center; padding:20px 10px;}
.sim-outcome .so-icon{font-size:48px;}
.sim-outcome .so-title{font-family:'Lora',serif; font-size:19px; font-weight:700; margin:8px 0 4px;}

/* ---------- presentation maker ---------- */
.unit-select-row{display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px;}
.unit-chip{flex-shrink:0; background:var(--panel); border:1px solid var(--panel-line); color:var(--text-muted); border-radius:20px; padding:7px 14px; font-size:12.5px; cursor:pointer; white-space:nowrap;}
.unit-chip.active{background:var(--amber); color:#20140a; border-color:var(--amber);}
.slide-viewer{background:#0B0E17; border:1px solid var(--panel-line); border-radius:var(--radius); aspect-ratio:16/9; display:flex; flex-direction:column; justify-content:center; padding:22px 24px; position:relative; overflow:hidden;}
.slide-viewer .slide-heading{font-family:'Lora',serif; font-size:19px; font-weight:700; color:var(--amber); margin-bottom:14px;}
.slide-viewer ul{margin:0; padding-left:18px; font-size:13px; line-height:1.6; color:var(--text);}
.slide-viewer .slide-num{position:absolute; bottom:10px; right:14px; font-size:10px; color:var(--text-muted);}
.slide-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px;}
.slide-nav button{background:var(--panel-raised); border:1px solid var(--panel-line); color:var(--text); border-radius:10px; width:42px; height:38px; font-size:16px; cursor:pointer;}
.slide-dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:center;}
.slide-dot{width:6px; height:6px; border-radius:50%; background:var(--panel-line);}
.slide-dot.active{background:var(--amber);}
#fullscreenSlideOverlay{position:fixed; inset:0; background:#0B0E17; z-index:100; display:none; flex-direction:column; justify-content:center; padding:8vw; align-items:center;}
#fullscreenSlideOverlay.show{display:flex;}
#fullscreenSlideOverlay .fs-heading{font-family:'Lora',serif; font-size:6vw; font-weight:700; color:var(--amber); margin-bottom:24px; text-align:center;}
#fullscreenSlideOverlay ul{font-size:3.4vw; line-height:1.7; color:var(--text); max-width:900px;}
#fullscreenSlideOverlay .fs-close{position:absolute; top:18px; right:22px; background:var(--panel); border:1px solid var(--panel-line); color:var(--text); width:38px;height:38px;border-radius:10px; font-size:16px; cursor:pointer;}
#fullscreenSlideOverlay .fs-tap{position:absolute; inset:0; display:flex;}
#fullscreenSlideOverlay .fs-tap div{flex:1;}
</style>
</head>
<body>
<div id="app">

  <div class="vitals">
    <div class="vitals-row">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="13" stroke="var(--amber)" stroke-width="1.5"/><path d="M7 14h3l2-6 4 12 2-6h3" stroke="var(--teal)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <span class="brand-name">NurseQuest</span>
      </div>
      <div class="vitals-stats">
        <div class="vstat"><span class="dot"></span><b id="hdrLevel">Lv 1</b></div>
        <div class="vstat streak"><span class="dot"></span><b id="hdrStreak">0</b></div>
      </div>
    </div>
    <div class="ecg-strip">
      <svg viewBox="0 0 600 40" preserveAspectRatio="none"><path d="M0 20 L60 20 L75 20 L85 4 L95 36 L105 20 L160 20 L175 20 L185 4 L195 36 L205 20 L260 20 L275 20 L285 4 L295 36 L305 20 L360 20 L375 20 L385 4 L395 36 L405 20 L460 20 L475 20 L485 4 L495 36 L505 20 L560 20 L575 20 L585 4 L595 36 L600 20 M300 20 L360 20 L375 20 L385 4 L395 36 L405 20 L460 20 L475 20 L485 4 L495 36 L505 20 L560 20 L575 20 L585 4 L595 36 L605 20 L660 20 L675 20 L685 4 L695 36 L705 20 L760 20 L775 20 L785 4 L795 36 L805 20 L860 20 L875 20 L885 4 L895 36 L905 20 L960 20 L975 20 L985 4 L995 36 L1000 20 L1100 20" stroke="var(--teal)" stroke-width="1.6" fill="none" opacity="0.55"/></svg>
    </div>
    <div class="xpbar-track"><div class="xpbar-fill" id="xpbarFill" style="width:0%"></div></div>
  </div>

  <div class="screens" id="screens">
    <!-- HOME -->
    <div class="screen active" id="screen-home"></div>
    <!-- STUDY (subject list) -->
    <div class="screen" id="screen-study"></div>
    <!-- TOPICS (unit/topic list within a subject) -->
    <div class="screen" id="screen-topics"></div>
    <!-- TOPIC DETAIL -->
    <div class="screen" id="screen-topicdetail"></div>
    <!-- EXAM SHEETS -->
    <div class="screen" id="screen-examsheets"></div>
    <!-- EXAM SHEET DETAIL -->
    <div class="screen" id="screen-examsheetdetail"></div>
    <!-- CLINICAL SIMULATION HUB -->
    <div class="screen" id="screen-simhub"></div>
    <!-- CLINICAL SIMULATION SESSION -->
    <div class="screen" id="screen-sim"></div>
    <!-- PRESENTATION MAKER -->
    <div class="screen" id="screen-pptmaker"></div>
    <!-- PRESENTATION RESULT -->
    <div class="screen" id="screen-pptresult"></div>
    <!-- QUIZ HUB -->
    <div class="screen" id="screen-quizhub"></div>
    <!-- QUIZ SESSION -->
    <div class="screen" id="screen-quiz"></div>
    <!-- AI CHAT -->
    <div class="screen" id="screen-ai"></div>
    <!-- PROFILE -->
    <div class="screen" id="screen-profile"></div>
  </div>

  <div class="navbar">
    <button class="navbtn" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>Home</button>
    <button class="navbtn" data-nav="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5"/><path d="M4 5.5v16"/></svg>Study</button>

/* ============ SIM SESSION ============ */
let SIM = null;
function beginSim(id){
  const scenario = SIM_SCENARIOS.find(s=>s.id===id);
  SIM = { scenario, i:-1, status:100, mistakes:0, answered:false };
  go('sim');
}
function statusColor(status){
  if(status >= 70) return 'var(--success)';
  if(status >= 40) return 'var(--amber)';
  return 'var(--danger)';
}
function renderSim(){
  const el = document.getElementById('screen-sim');
  if(!SIM){ el.innerHTML = `<div class="empty-state">No active simulation.</div>`; return; }
  const s = SIM.scenario;
  if(SIM.i === -1){
    el.innerHTML = `<div class="backbar">
      <button class="backbtn" onclick="go('simhub')">‹</button>
      <div><h2 style="font-size:15px;">${s.icon} ${escapeHtml(s.title)}</h2></div>
    </div>
    <div class="sim-scene">
      <div class="scene-icon">${s.icon}</div>
      <div class="scene-setting">${escapeHtml(s.setting.toUpperCase())}</div>
    </div>
    <div class="sim-card">
      <p style="font-size:14px;line-height:1.6;margin:0 0 14px;">${escapeHtml(s.intro)}</p>
      <button class="btn" onclick="advanceSim()">Begin simulation</button>
    </div>`;
    return;
  }
  if(SIM.i >= s.steps.length){ renderSimOutcome(); return; }
  const step = s.steps[SIM.i];
  let html = `<div class="backbar">
    <button class="backbtn" onclick="go('simhub')">‹</button>
    <div><h2 style="font-size:15px;">${s.icon} ${escapeHtml(s.title)}</h2></div>
  </div>
  <div class="sim-scene">
    <div class="scene-icon">${s.icon}</div>
    <div class="scene-setting">${escapeHtml(s.setting.toUpperCase())}</div>
    <div class="vitals-monitor">
      <div class="vmon ${SIM.status>=70?'ok':'warn'}"><div class="vval">${SIM.status}%</div><div class="vlbl">PATIENT STATUS</div></div>
      <div class="vmon"><div class="vval">${SIM.i+1}/${s.steps.length}</div><div class="vlbl">STEP</div></div>
    </div>
    <div class="status-track"><div class="status-fill" style="width:${SIM.status}%;background:${statusColor(SIM.status)}"></div></div>
  </div>
  <div class="sim-card">
    <div class="sim-step-tag">DECISION POINT ${SIM.i+1}</div>
    <div class="quiz-q">${escapeHtml(step.prompt)}</div>
    <div id="simOptsWrap">`;
  step.choices.forEach((c,idx)=>{
    html += `<button class="opt" onclick="answerSim(${idx})">${escapeHtml(c.text)}</button>`;
  });
  html += `</div><div id="simFeedbackWrap"></div></div>`;
  el.innerHTML = html;
}
function answerSim(idx){
  if(SIM.answered) return;
  SIM.answered = true;
  const step = SIM.scenario.steps[SIM.i];
  const choice = step.choices[idx];
  const opts = document.querySelectorAll('#simOptsWrap .opt');
  opts.forEach((btn,i)=>{
    btn.disabled = true;
    if(step.choices[i].correct) btn.classList.add('correct');
    else if(i===idx && !choice.correct) btn.classList.add('wrong');
  });
  if(choice.correct){
    addXP(8);
  } else {
    SIM.status = Math.max(0, SIM.status - 25);
    SIM.mistakes++;
  }
  document.getElementById('simFeedbackWrap').innerHTML = `<div class="quiz-explain">${choice.correct?'✅ ':'⚠️ '}${escapeHtml(choice.fb||'')}</div>
    <button class="btn" style="margin-top:12px;" onclick="advanceSim()">${SIM.i+1 < SIM.scenario.steps.length ? 'Continue':'See outcome'}</button>`;
}
function advanceSim(){
  SIM.i++;
  SIM.answered = false;
  renderSim();
}
function renderSimOutcome(){
  const el = document.getElementById('screen-sim');
  const s = SIM.scenario;
  let icon, title, msg;
  if(SIM.mistakes === 0){ icon='🟢'; title='Excellent — stable outcome'; msg='You made every decision correctly. The patient came through the scenario stable and safe, exactly as sound clinical judgement should deliver.'; }
  else if(SIM.status >= 50){ icon='🟡'; title='Managed, with room to improve'; msg=`You made ${SIM.mistakes} misstep(s) along the way. The outcome was still safe, but review the feedback above to sharpen your decision-making for next time.`; }
  else { icon='🔴'; title='Outcome compromised'; msg=`${SIM.mistakes} critical misstep(s) affected patient status significantly. Revisit the feedback for each step and try the scenario again.`; }
  el.innerHTML = `<div class="sim-card sim-outcome">
    <div class="so-icon">${icon}</div>
    <div class="so-title">${title}</div>
    <p style="font-size:13.5px;color:var(--text-muted);line-height:1.6;">${escapeHtml(msg)}</p>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn secondary" onclick="go('simhub')">More scenarios</button>
      <button class="btn" onclick="beginSim('${s.id}')">Retry</button>
    </div>
  </div>`;
  addXP(SIM.mistakes===0 ? 15 : 5);
}

function setPptMode(m){ PPT_MODE = m; renderPptMaker(); }
function pptPickSubject(s){ PPT_SELECTED_SUBJECT = s; PPT_SELECTED_UNIT = unitsOf(s)[0]; renderPptMaker(); }
function pptPickUnit(u){ PPT_SELECTED_UNIT = u; renderPptMaker(); }
function pptSetStatus(msg){ const el = document.getElementById('pptStatus'); if(el) el.innerHTML = msg; }

async function generatePptFromUnit(){
  if(!STATE.apiKey){ showApiKeyPrompt(); return; }
  const topics = SYLLABUS[PPT_SELECTED_SUBJECT].filter(t=>t.unit===PPT_SELECTED_UNIT).map(t=>t.topic);
  const title = `${SUBJECT_META[PPT_SELECTED_SUBJECT].short} — Unit ${PPT_SELECTED_UNIT}`;
  await buildDeck(title, topics);
}
function generatePptFromCustom(){
  if(!STATE.apiKey){ showApiKeyPrompt(); return; }
  const title = document.getElementById('pptCustomTitle').value.trim() || 'Nursing Presentation';
  const topics = document.getElementById('pptCustomTopics').value.split('\n').map(t=>t.trim()).filter(Boolean);
  if(!topics.length){ pptSetStatus('Add at least one topic or point.'); return; }
  buildDeck(title, topics);
}
async function buildDeck(title, topics){
  pptSetStatus(`<span class="spinner"></span> Building slides for "${escapeHtml(title)}"...`);
  const prompt = `Create a concise slide deck outline for a B.Sc. Nursing student presentation.\nDeck title: ${title}\nCover these topics/points (one or more slides per topic as needed, keep total slides between 6 and 14):\n${topics.map((t,i)=>`${i+1}. ${t}`).join('\n')}\n\nRespond ONLY with strict JSON, no markdown fences, in this exact shape:\n{"title":"...", "slides":[{"heading":"...", "bullets":["...","...","..."]}]}\nEach slide should have 3-5 short, exam-relevant bullet points (not full sentences, phrase-level). Include a title slide as slides[0] with the deck title as heading and bullets as a short subtitle/agenda list.`;
  try{
    const raw = await callAI(prompt);
    const clean = raw.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    PPT_DECK = { title: parsed.title || title, slides: parsed.slides || [] };
    PPT_SLIDE_I = 0;
    addXP(10);
    go('pptresult');
  }catch(err){
    pptSetStatus('Error: '+err.message);
  }
}

function renderPptResult(){
  const el = document.getElementById('screen-pptresult');
  if(!PPT_DECK || !PPT_DECK.slides.length){ el.innerHTML = `<div class="empty-state">No deck generated yet.</div>`; return; }
  const slide = PPT_DECK.slides[PPT_SLIDE_I];
  let html = `<div class="backbar">
    <button class="backbtn" onclick="go('pptmaker')">‹</button>
    <div><h2 style="font-size:15px;">${escapeHtml(PPT_DECK.title)}</h2><div class="sub">Slide ${PPT_SLIDE_I+1} of ${PPT_DECK.slides.length}</div></div>

  <div class="slide-viewer">
    <div class="slide-heading">${escapeHtml(slide.heading||'')}</div>
    <ul>${(slide.bullets||[]).map(b=>`<li>${escapeHtml(b)}</li>`).join('')}</ul>
    <div class="slide-num">${PPT_SLIDE_I+1}/${PPT_DECK.slides.length}</div>
  </div>
  <div class="slide-nav">
    <button onclick="pptGo(-1)">‹</button>
    <div class="slide-dots">${PPT_DECK.slides.map((_,i)=>`<div class="slide-dot ${i===PPT_SLIDE_I?'active':''}"></div>`).join('')}</div>
    <button onclick="pptGo(1)">›</button>
  </div>

  el.innerHTML = html;
}
function pptGo(dir){
  PPT_SLIDE_I = Math.max(0, Math.min(PPT_DECK.slides.length-1, PPT_SLIDE_I+dir));
  renderPptResult();
}
function presentFullscreen(){
  const overlay = document.getElementById('fullscreenSlideOverlay');
  overlay.classList.add('show');
  if(overlay.requestFullscreen) overlay.requestFullscreen().catch(()=>{});
  renderFsSlide();
}
function closeFullscreenSlides(){
  document.getElementById('fullscreenSlideOverlay').classList.remove('show');
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  renderPptResult();
}
function renderFsSlide(){
  const slide = PPT_DECK.slides[PPT_SLIDE_I];
  document.getElementById('fsHeading').textContent = slide.heading||'';
  document.getElementById('fsBullets').innerHTML = `<ul>${(slide.bullets||[]).map(b=>`<li>${escapeHtml(b)}</li>`).join('')}</ul>`;
}
function fsNext(){ if(PPT_SLIDE_I < PPT_DECK.slides.length-1){ PPT_SLIDE_I++; renderFsSlide(); } }
function fsPrev(){ if(PPT_SLIDE_I > 0){ PPT_SLIDE_I--; renderFsSlide(); } }

function downloadPptx(){
  try{
    const pptx = new PptxGenJS();
    pptx.defineSlideMaster({ title:'MASTER', background:{color:'10141F'} });
    PPT_DECK.slides.forEach((s, idx)=>{
      const slide = pptx.addSlide();
      slide.background = { color:'10141F' };
      slide.addText(s.heading||'', { x:0.5, y:0.4, w:9, h:1, fontSize: idx===0?32:26, bold:true, color:'F2A65A', fontFace:'Georgia' });
      if(s.bullets && s.bullets.length){
        slide.addText(s.bullets.map(b=>({text:b, options:{bullet:true, breakLine:true}})), { x:0.7, y:1.6, w:8.6, h:4.8, fontSize:16, color:'EDEAE3', fontFace:'Arial' });
      }
      slide.addText(`${idx+1}/${PPT_DECK.slides.length}`, { x:9.2, y:5.3, w:0.6, h:0.3, fontSize:9, color:'9098B1' });
    });
    pptx.writeFile({ fileName: (PPT_DECK.title||'NurseQuest-Deck').replace(/[^a-z0-9]+/gi,'_') + '.pptx' });
    showToast('Downloading .pptx...');
  }catch(err){
    showToast('Export error: '+err.message);
  }
}

/* ============ STATE ============ */
const DEFAULT_STATE = {
  xp:0, level:1, streak:0, lastActiveDate:null,
  completed:{}, // subject -> Set-like object of topic index -> true
  quizStats:{ taken:0, correct:0 },
  lastTopic:null, // {subject, unit, topic}
  apiKey:"", apiProvider:"gemini",
  theme:"amber",
  chatHistory:[],
  badges:{},
  examSheets:[], // {id, name, type:'image'|'topics', createdAt, items:[{question/topic, answer, diagram:[]}]}
};
let STATE = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem('nursequest_state_v1');
    if(!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    const st = Object.assign(structuredClone(DEFAULT_STATE), parsed);
    if(st.apiProvider !== 'gemini'){ st.apiKey = ''; st.apiProvider = 'gemini'; } // key from another provider is not valid for Gemini
    return st;
  }catch(e){ return structuredClone(DEFAULT_STATE); }
}
function saveState(){
  localStorage.setItem('nursequest_state_v1', JSON.stringify(STATE));
}

const THEMES = {
  amber:{ amber:"#F2A65A", teal:"#4FD1C5" },
  rose:{ amber:"#E8697A", teal:"#F2A65A" },
  violet:{ amber:"#B893E0", teal:"#4FD1C5" },
  mint:{ amber:"#7FCB8C", teal:"#F2A65A" },
};
function applyTheme(){
  const t = THEMES[STATE.theme] || THEMES.amber;
  document.documentElement.style.setProperty('--amber', t.amber);
  document.documentElement.style.setProperty('--teal', t.teal);
}

function xpForLevel(level){ return 100 * level; }
function addXP(amount){
  STATE.xp += amount;
  let needed = xpForLevel(STATE.level);
  while(STATE.xp >= needed){
    STATE.xp -= needed;
    STATE.level += 1;
    needed = xpForLevel(STATE.level);
    showToast(`Level up! You're now Level ${STATE.level} 🎉`);
  }
  touchStreak();
  checkBadges();
  saveState();
  renderVitals();
}
function touchStreak(){
  const today = new Date().toDateString();
  if(STATE.lastActiveDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  if(STATE.lastActiveDate === y.toDateString()){ STATE.streak += 1; }
  else { STATE.streak = 1; }
  STATE.lastActiveDate = today;
}
function checkBadges(){
  const b = STATE.badges;
  if(STATE.quizStats.taken >= 1) b.first_quiz = true;
  if(STATE.quizStats.taken >= 10) b.quiz_10 = true;
  if(STATE.streak >= 3) b.streak_3 = true;
  if(STATE.streak >= 7) b.streak_7 = true;
  if(STATE.level >= 5) b.level_5 = true;
  const totalDone = Object.values(STATE.completed).reduce((s,o)=>s+Object.keys(o).length,0);
  if(totalDone >= 20) b.topics_20 = true;
  if(totalDone >= 100) b.topics_100 = true;
}
function markTopicDone(subject, idx){
  if(!STATE.completed[subject]) STATE.completed[subject] = {};
  if(!STATE.completed[subject][idx]){
    STATE.completed[subject][idx] = true;
    addXP(5);
  }
  saveState();
}
function subjectProgress(subject){
  const total = SYLLABUS[subject].length;
  const done = STATE.completed[subject] ? Object.keys(STATE.completed[subject]).length : 0;
  return { done, total, pct: total? Math.round(done/total*100):0 };
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>el.classList.remove('show'), 2400);
}

function extractTopicColumn(rows){
  if(!rows.length) return [];
  const body = rows.slice(1);
  const numCols = Math.max(...rows.map(r=>r.length));
  let bestCol = 0, bestAvg = -1;
  for(let c=0;c<numCols;c++){
    const vals = body.map(r=>r[c]).filter(v=>typeof v==='string');
    if(!vals.length) continue;
    const avg = vals.reduce((s,v)=>s+v.length,0)/vals.length;
    if(avg > bestAvg){ bestAvg = avg; bestCol = c; }
  }
  return body.map(r=>r[bestCol]).filter(v=>typeof v==='string' && v.trim().length>3);
}

const GEMINI_FALLBACK_MODELS = ['gemini-2.5-flash','gemini-2.0-flash','gemini-1.5-flash'];
let _geminiModelCache = { key:'', list:null };
function resetGeminiModels(){ _geminiModelCache = { key:'', list:null }; }
// Ask Google which models THIS key can use, then rank them (newest flash first).
async function getGeminiModels(key){
  if(_geminiModelCache.key === key && _geminiModelCache.list) return _geminiModelCache.list;
  try{
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', {
      headers:{ 'x-goog-api-key': key }
    });
    if(!res.ok) throw new Error('list failed ' + res.status);
    const data = await res.json();
    const bad = /image|tts|live|audio|embedding|aqa|imagen|robotics|computer-use|learnlm|veo|gemma/i;
    const ok = (data.models||[])
      .filter(m=> (m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m=> m.name.replace(/^models\//,''))
      .filter(n=> /^gemini-/.test(n) && !bad.test(n));
    const ver = n => parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1]);
    const tier = n => /flash-lite/.test(n) ? 1 : /flash/.test(n) ? 0 : 2; // flash, then lite, then pro
    ok.sort((a,b)=> tier(a)-tier(b) || ver(b)-ver(a) || (/preview|exp/.test(a)?1:0)-(/preview|exp/.test(b)?1:0));
    const list = ok.slice(0,4);
    if(list.length){ _geminiModelCache = { key, list }; return list; }
  }catch(e){}
  return GEMINI_FALLBACK_MODELS;
}
const sleepMs = ms => new Promise(r=>setTimeout(r,ms));
async function callGemini(parts){
  const key = (STATE.apiKey || '').trim();
  if(!key) throw new Error('No API key set. Add one in Profile.');
  let lastErr = null;
  const GEMINI_MODELS = await getGeminiModels(key);
  // Try each model; on 503/500 (overloaded) retry once, then fall back to the next model.
  for(const model of GEMINI_MODELS){
    for(let attempt=0; attempt<2; attempt++){
      let res;
      try{
        res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent', {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'x-goog-api-key': key },
          body: JSON.stringify({ contents:[{ parts }] })
        });
      }catch(e){
        throw new Error('Could not reach Gemini. Check your internet and open this app from your phone browser (not inside the Claude preview).');
      }
      const raw = await res.text();
      let data = {};
      try { data = raw ? JSON.parse(raw) : {}; } catch(e) {}

      if(res.ok){
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if(!text) throw new Error(data?.promptFeedback?.blockReason
          ? 'Gemini blocked the request: ' + data.promptFeedback.blockReason
          : 'Gemini returned no text response.');
        STATE.lastModel = model;
        return text.trim();
      }

      const apiMsg = data?.error?.message || raw || 'Unknown API error';
      if(res.status === 400) throw new Error('Invalid request: ' + apiMsg);
      if(res.status === 401 || res.status === 403) throw new Error('API key rejected. Check that the key is a Gemini API key and that the Gemini API is enabled. Details: ' + apiMsg);
      if(res.status === 404){ lastErr = new Error('Gemini model ' + model + ' not found. Details: ' + apiMsg); break; } // try next model
      if(res.status === 429) throw new Error('Gemini rate limit/quota reached. Try again later. Details: ' + apiMsg);
      lastErr = new Error('Gemini API error ('+res.status+'): ' + apiMsg);
      if(attempt === 0) await sleepMs(1500); // brief wait, then retry same model
    }
  }
  throw lastErr || new Error('Gemini request failed.');
}
async function callAIParts(parts){
  return callGemini(parts);
}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function buildQuizQuestions(subject, count){
  const seed = shuffle(QUIZ_BANK[subject] || []).slice(0, Math.min(count, (QUIZ_BANK[subject]||[]).length));
  return seed.map(q=>({ ...q, source:'seed' }));
}

  const raw = await callAI(prompt);

}

    <div id="optsWrap">`;
  q.opts.forEach((opt,i)=>{
    html += `<button class="opt" onclick="answerQuiz(${i})">${escapeHtml(opt)}</button>`;
  });
  html += `</div><div id="quizExplainWrap"></div></div>`;
  el.innerHTML = html;
}
function answerQuiz(i){
  const q = QUIZ.questions[QUIZ.i];
  if(QUIZ.answered) return;
  QUIZ.answered = true;
  const opts = document.querySelectorAll('#optsWrap .opt');
  opts.forEach((btn,idx)=>{
    btn.disabled = true;
    if(idx === q.a) btn.classList.add('correct');
    else if(idx === i) btn.classList.add('wrong');
  });
  const correct = (i === q.a);
  if(correct){ QUIZ.correct++; addXP(10); } else { addXP(2); }
  STATE.quizStats.taken++;
  if(correct) STATE.quizStats.correct++;
  checkBadges();
  saveState();
  document.getElementById('quizExplainWrap').innerHTML = `<div class="quiz-explain">${correct? '✅ Correct. ':'❌ Not quite. '}${escapeHtml(q.ex||'')}</div>
  <button class="btn" style="margin-top:12px;" onclick="nextQuizQuestion()">${QUIZ.i+1<QUIZ.questions.length? 'Next question':'See results'}</button>`;
}
function nextQuizQuestion(){
  QUIZ.i++;
  QUIZ.answered = false;
  renderQuiz();
}
function renderQuizScore(){
  const el = document.getElementById('screen-quiz');
  const total = QUIZ.questions.length;
  const pct = total? Math.round(QUIZ.correct/total*100) : 0;
  el.innerHTML = `<div class="quiz-card quiz-score">
    <div style="font-size:13px;color:var(--text-muted);">Quiz complete</div>
    <div class="big">${QUIZ.correct}/${total}</div>
    <div style="color:var(--text-muted);font-size:13px;margin-bottom:18px;">${pct}% correct</div>
    <div class="btn-row">
      <button class="btn secondary" onclick="go('quizhub')">Back to Quiz</button>
      <button class="btn" onclick="beginQuiz('${escapeAttr(QUIZ.subject)}')">Try again</button>
    </div>
  </div>`;
}

/* ============ AI CHAT ============ */
function renderAI(){
  const el = document.getElementById('screen-ai');
  let html = `<h2 class="serif" style="margin:0 0 4px;font-size:20px;">AI Assistant</h2>
  <p class="hero-line" style="margin-bottom:10px;">Ask anything from your syllabus — case scenarios, drug doses, exam-style Q&A.</p>
  <div class="chat-wrap" style="height:calc(100vh - 320px);">
  <div class="chip-row">
    <div class="chip" onclick="askQuick('Explain the difference between cyanotic and acyanotic congenital heart disease')">CHD types</div>
    <div class="chip" onclick="askQuick('Give me 3 nursing priorities for a patient in delirium tremens')">DTs priorities</div>
    <div class="chip" onclick="askQuick('Explain the stages of labour briefly')">Stages of labour</div>
    <div class="chip" onclick="askQuick('What is the difference between validity and reliability in research?')">Validity vs reliability</div>
  </div>
  <div class="chat-log" id="chatLog"></div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="Ask your AI assistant..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">➤</button>
  </div>
  </div>`;
  el.innerHTML = html;
  renderChatLog();
}
function renderChatLog(){
  const log = document.getElementById('chatLog');
  if(!log) return;
  log.innerHTML = STATE.chatHistory.map(m=>`<div class="msg ${m.role}">${escapeHtml(m.text)}</div>`).join('');
  log.scrollTop = log.scrollHeight;
}
function askQuick(text){
  document.getElementById('chatInput').value = text;
  sendChat();
}
async function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  if(!STATE.apiKey){ showApiKeyPrompt(); return; }
  input.value = '';
  STATE.chatHistory.push({role:'user', text});
  saveState();
  renderChatLog();
  STATE.chatHistory.push({role:'ai', text:'…'});
  renderChatLog();
  try{
    const prompt = `You are a friendly, precise nursing tutor helping a B.Sc. Nursing student (subjects: Child Health, Mental Health, Community Health, Nursing Research & Statistics, OBG Nursing). Answer clearly and concisely for exam prep.\n\nStudent question: ${text}`;
    const reply = await callAI(prompt);
    STATE.chatHistory[STATE.chatHistory.length-1] = {role:'ai', text:reply};
  }catch(err){
    STATE.chatHistory[STATE.chatHistory.length-1] = {role:'ai', text:'Error: '+err.message};
  }
  saveState();
  renderChatLog();
}

/* ============ AI CALL (Gemini) ============ */
async function callAI(prompt){
  return callGemini([{text:prompt}]);
}
function showApiKeyPrompt(){
  showToast('Add a free Gemini API key in Profile → Settings first');
  go('profile');
}

/* ============ PROFILE ============ */
function renderProfile(){
  const el = document.getElementById('screen-profile');
  const totalDone = SUBJECTS.reduce((s,k)=>s+subjectProgress(k).done,0);
  const acc = STATE.quizStats.taken? Math.round(STATE.quizStats.correct/STATE.quizStats.taken*100):0;
  const badgeDefs = [
    {id:'first_quiz', ic:'🎯', label:'First Quiz'},
    {id:'quiz_10', ic:'🏹', label:'10 Quizzes'},
    {id:'streak_3', ic:'🔥', label:'3-Day Streak'},
    {id:'streak_7', ic:'⚡', label:'7-Day Streak'},
    {id:'level_5', ic:'🎖️', label:'Level 5'},
    {id:'topics_20', ic:'📘', label:'20 Topics'},
    {id:'topics_100', ic:'📚', label:'100 Topics'},
  ];
  let html = `<h2 class="serif" style="margin:0 0 14px;font-size:20px;">Your Progress</h2>
  <div class="section-title" style="margin-top:0;">Tools</div>
  <div class="btn-row" style="margin-bottom:16px;">
    <button class="btn secondary" onclick="go('pptmaker')">🖥 Presentation Maker</button>
    <button class="btn secondary" onclick="goToExamSheets()">📄 Exam Sheets</button>
  </div>
  <div class="stat-grid">
    <div class="stat-box"><div class="num">${STATE.level}</div><div class="lbl">LEVEL</div></div>
    <div class="stat-box"><div class="num">${STATE.streak}</div><div class="lbl">DAY STREAK</div></div>
    <div class="stat-box"><div class="num">${totalDone}</div><div class="lbl">TOPICS DONE</div></div>
  </div>
  <div class="stat-grid">
    <div class="stat-box"><div class="num">${STATE.quizStats.taken}</div><div class="lbl">QUIZZES</div></div>
    <div class="stat-box"><div class="num">${acc}%</div><div class="lbl">ACCURACY</div></div>
    <div class="stat-box"><div class="num">${STATE.xp}</div><div class="lbl">XP (this lvl)</div></div>
  </div>

  <div class="section-title">Badges</div>
  <div class="badge-row">
  ${badgeDefs.map(b=>`<div class="badge ${STATE.badges[b.id]?'':'locked'}"><div class="bic">${b.ic}</div>${b.label}</div>`).join('')}
  </div>

  <div class="section-title">Theme</div>
  <div class="theme-row">
    ${Object.keys(THEMES).map(t=>`<div class="theme-swatch ${STATE.theme===t?'active':''}" style="background:${THEMES[t].amber}" onclick="setTheme('${t}')"></div>`).join('')}
  </div>

  <div class="section-title">AI Assistant Settings</div>
  <div class="field-label">Gemini API key (free — from aistudio.google.com/apikey). Stored only on this device.</div>
  <input class="field-input" id="apiKeyInput" type="password" placeholder="Paste your API key" value="${escapeAttr(STATE.apiKey)}">
  <div class="btn-row" style="margin-top:10px;">
    <button class="btn" onclick="saveApiKey()">Save key</button>
    <button class="btn secondary" onclick="testApiKey()">Test key</button>
  </div>
  <div id="apiKeyStatus" style="margin-top:10px;font-size:12px;line-height:1.45;color:var(--text-muted);"></div>
  <p class="hero-line" style="margin-top:20px;">Without a key, study topics and quizzes still work fully from the built-in question bank — only AI explanations and chat need a key.</p>
  `;
  el.innerHTML = html;
}
function setTheme(t){ STATE.theme = t; saveState(); applyTheme(); renderProfile(); }
function saveApiKey(){
  const key = document.getElementById('apiKeyInput').value.trim();
  if(!key){
    showToast('Please paste a Gemini API key first');
    return;
  }
  STATE.apiKey = key;
  resetGeminiModels();
  saveState();
  showToast('API key saved — tap Test key to verify it');
}

async function testApiKey(){
  const input = document.getElementById('apiKeyInput');
  const status = document.getElementById('apiKeyStatus');
  const key = (input?.value || '').trim();

  if(!key){
    if(status) status.textContent = 'Paste your Gemini API key first.';
    return;
  }

  STATE.apiKey = key;
  resetGeminiModels();
  saveState();
  if(status) status.innerHTML = '<span class="spinner"></span> Testing Gemini connection...';

  try{
    const reply = await callAI('Reply with exactly: NurseQuest API connection OK');
    if(status) status.textContent = '✅ API key works. Using model: ' + (STATE.lastModel || 'Gemini');
    showToast('Gemini API connected successfully');
  }catch(err){
    if(status) status.textContent = '❌ ' + err.message;
    showToast('Gemini connection failed');
  }
}

/* ============ SCREEN ROUTER ============ */
function renderScreen(screen){
  if(screen==='home') renderHome();
  if(screen==='study') renderStudy();
  if(screen==='topics') renderTopics();
  if(screen==='topicdetail') renderTopicDetail();
  if(screen==='examsheetdetail') renderExamSheetDetail();
  if(screen==='quizhub') renderQuizHub();
  if(screen==='quiz') renderQuiz();
  if(screen==='simhub') renderSimHub();
  if(screen==='sim') renderSim();
  if(screen==='pptmaker') renderPptMaker();
  if(screen==='pptresult') renderPptResult();
  if(screen==='ai') renderAI();
  if(screen==='profile') renderProfile();
}

/* ============ HELPERS ============ */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }
function truncate(s,n){ return s.length>n? s.slice(0,n-1)+'…' : s; }

/* ============ INIT ============ */
applyTheme();
renderVitals();
go('home');

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
